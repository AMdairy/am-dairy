<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM DAIRY - Fresh Milk Delivery</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f9fafb;color:#111}
.header{background:#15803d;color:white;padding:12px;text-align:center;font-weight:800;font-size:14px}
.container{max-width:500px;margin:0 auto;padding:12px}
.card{border:1px solid #e5e7eb;padding:12px;border-radius:12px;background:white;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.scroll-box{height:380px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:14px;padding:10px;background:#fafafa}
.qty-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid #15803d;background:white;font-weight:bold;cursor:pointer}
.sel{padding:4px 8px;border-radius:6px;border:1px solid #d1d5db;font-size:12px}
.bill-box{background:white;border:2px solid #15803d;border-radius:12px;padding:14px;margin-top:14px}
#qrImg{display:block;margin:10px auto;border:2px solid #15803d;border-radius:10px;padding:6px;background:white}
</style>
</head>
<body>
<div class="header">📞 95244 53822 | ⏰ 5:30AM-8AM 5PM-8PM | AM DAIRY</div>
<div class="container">
<h3 style="color:#15803d;margin:8px 0;">🥛 AM Dairy Products - Select Quantity</h3>
<div class="scroll-box" id="productList"></div>

<div class="bill-box">
<div id="bill" style="font-size:13px;line-height:1.6;color:#333">No items selected</div>
<hr style="margin:10px 0">
<div style="font-weight:900;font-size:18px;color:#15803d" id="tot">Total Rs. 0</div>
<div style="text-align:center;margin-top:12px">
<div style="font-weight:700;color:#15803d;font-size:13px">💳 QR Code - Scan & Pay</div>
<img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=upi%3A%2F%2Fpay%3Fpa%3Darulkumarfly-2%40oksbi%26pn%3DAM%2520DAIRY%26am%3D0%26cu%3DINR" alt="UPI QR" width="200" height="200">
<div style="font-size:12px;margin:4px 0">UPI: arulkumarfly-2@oksbi</div>
<div id="qAmt" style="font-size:13px;font-weight:700;color:#15803d;background:#dcfce7;padding:6px;border-radius:6px;display:inline-block">Total Rs.0 - Scan to Pay</div>
<br><br>
<a id="payBtn" href="upi://pay?pa=arulkumarfly-2@oksbi&pn=AM DAIRY&am=0&cu=INR" style="background:#3b82f6;color:white;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block;width:80%;text-align:center">💳 PAY VIA UPI / GPAY / PHONEPE</a>
</div>
</div>
<div style="margin-top:12px;color:#15803d;font-size:13px;font-weight:700">📁 Customer Booking - 7 Areas</div>
</div>

<script>
const P = [
  {k:0, n:"🐄 Cow Milk", o:[{l:"200ml - Rs.13", p:13}, {l:"500ml - Rs.30", p:30}]},
  {k:1, n:"🐃 Buffalo Milk", o:[{l:"200ml - Rs.17", p:17}, {l:"500ml - Rs.40", p:40}]},
  {k:2, n:"🥣 Curd", o:[{l:"200ml - Rs.15", p:15}, {l:"500ml - Rs.40", p:40}]},
  {k:3, n:"🧈 Butter", o:[{l:"200g - Rs.100", p:100}, {l:"1kg - Rs.500", p:500}]},
  {k:4, n:"🥛 Buttermilk", o:[{l:"500ml - Rs.20", p:20}, {l:"1L - Rs.40", p:40}]},
  {k:5, n:"🧈 Ghee", o:[{l:"50ml - Rs.50", p:50}, {l:"100ml - Rs.85", p:85}, {l:"200ml - Rs.150", p:150}, {l:"500ml - Rs.365", p:365}]},
];
let Q = {}; let S = {};
P.forEach(x=>{ Q[x.k]=0; S[x.k]=0; });

function cn(k,a){
  Q[k]=(Q[k]||0)+a;
  if(Q[k]<0) Q[k]=0;
  upd();
}
function selOpt(k, idx){ S[k]=idx; upd(); }

function upd(){
  let t=0, txt='';
  P.forEach(x=>{
    let optIdx = S[x.k] ?? 0;
    let price = x.o[optIdx].p;
    let qty = Q[x.k] || 0;
    let sub = price*qty;
    let el=document.getElementById('s-'+x.k);
    if(el) el.innerText='Rs. '+sub;
    if(qty>0){
      t+=sub;
      txt+=`${x.n} ${x.o[optIdx].l} x${qty} = Rs.${sub}<br>`;
    }
  });
  document.getElementById('bill').innerHTML=txt||'No items selected';
  document.getElementById('tot').innerText='Total Rs. '+t;
  document.getElementById('qAmt').innerText='Total Rs.'+t+' - Scan to Pay';
  
  // QR CODE AMOUNT UPDATE FIX - ITHU THAN MAIN DA
  let upiLink = `upi://pay?pa=arulkumarfly-2@oksbi&pn=AM DAIRY&am=${t}&cu=INR`;
  let qr = document.getElementById('qrImg');
  if(qr){
    qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiLink)}`;
  }
  let payBtn = document.getElementById('payBtn');
  if(payBtn) payBtn.href = upiLink;
}

function render(){
  let html='';
  P.forEach(x=>{
    let opts = x.o.map((o,i)=>`<option value="${i}">${o.l}</option>`).join('');
    html+=`<div class="card">
      <div style="flex:1">
        <div style="font-weight:700;font-size:13px">${x.n}</div>
        <select class="sel" onchange="selOpt(${x.k}, this.value)">${opts}</select>
        <div style="font-size:12px;color:#15803d;font-weight:700;margin-top:4px" id="s-${x.k}">Rs. 0</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-left:10px">
        <button class="qty-btn" onclick="cn(${x.k},-1)">-</button>
        <span id="q-${x.k}" style="min-width:18px;text-align:center;font-weight:700">${Q[x.k]||0}</span>
        <button class="qty-btn" onclick="cn(${x.k},1)">+</button>
      </div>
    </div>`;
  });
  document.getElementById('productList').innerHTML=html;
  const origUpd = upd;
  window.upd = function(){
    origUpd();
    P.forEach(x=>{
      let qEl=document.getElementById('q-'+x.k);
      if(qEl) qEl.innerText=Q[x.k]||0;
    });
  }
  upd();
}
render();
</script>
</body>
</html>
