<!DOCTYPE html><html><head><title>Admin - AM DAIRY</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:Arial;margin:0;padding:10px;background:#f5f5f5}
.header{background:#0a7a2a;color:white;padding:15px;text-align:center;font-weight:bold;font-size:20px}
.card{background:white;margin:10px 0;padding:12px;border-radius:8px;box-shadow:0 2px 5px #ccc}
.btn{padding:6px 12px;margin:3px;border:0;border-radius:5px;color:white;cursor:pointer}
.green{background:green}.orange{background:orange}.blue{background:#2196F3}
</style></head><body>
<div class="header">🛵 AM DAIRY - Delivery Admin</div>
<button onclick="loadOrders()" style="padding:8px 15px;background:#0a7a2a;color:white;border:0;border-radius:5px;margin:10px 5px">🔄 Refresh</button>
<button onclick="window.open('delivery-boy.html')" style="padding:8px 15px;background:#2196F3;color:white;border:0;border-radius:5px">👦 Boy App</button>
<div id="orders">Loading...</div>
<script>
async function loadOrders(){
 document.getElementById('orders').innerHTML='Loading...';
 try{
  const res = await fetch('/api/orders');
  const orders = await res.json();
  if(orders.length==0){ document.getElementById('orders').innerHTML='<p style=text-align:center;margin-top:50px>No orders yet. Puthusa oru order pannu da!</p>'; return; }
  let html='';
  orders.slice().reverse().forEach(o=>{
    html+=`<div class="card">
    <b>ID: ${o.id}</b> - <span style="color:${o.status=='Pending'?'red':'green'}">${o.status||'Pending'}</span> - ${o.time||''}<br>
    <b>${o.name||''}</b> - ${o.phone||''}<br>
    📍 ${o.address||''}, ${o.area||''}<br>
    🥛 ${o.items||o.milk||''} - Total Rs.${o.total||''}<br><br>
    <button class="btn green" onclick="updateStatus(${o.id},'Delivered')">Delivered</button>
    <button class="btn orange" onclick="updateStatus(${o.id},'Out for Delivery')">Out for Delivery</button>
    <button class="btn blue" onclick="window.open('https://wa.me/${o.phone}?text=AM Dairy Order ${o.id}')">WhatsApp</button>
    </div>`;
  });
  document.getElementById('orders').innerHTML=html;
 }catch(e){ document.getElementById('orders').innerHTML='Error: '+e; }
}
async function updateStatus(id,status){
 await fetch('/api/update-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});
 loadOrders();
}
loadOrders();
setInterval(loadOrders,5000);
</script></body></html>
